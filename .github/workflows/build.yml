name: Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-release:
    name: Build Windows App
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # 1. Setup Python Environment (Backend)
      # ----------------------------------------------------------------
      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create Virtual Environment & Install Dependencies
        run: |
          uv venv
          uv pip install -e .
        # Installs dependencies from pyproject.toml (includes pyinstaller)

      # ----------------------------------------------------------------
      # 2. Setup Node.js Environment (Frontend/Electron)
      # ----------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: electron-app/package-lock.json

      - name: Install Node Dependencies
        working-directory: electron-app
        run: npm ci

      # ----------------------------------------------------------------
      # 3. Build Application
      # ----------------------------------------------------------------
      - name: Build Electron App
        working-directory: electron-app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Activate the Python virtual environment
          ..\.venv\Scripts\Activate.ps1
          
          # Verify Python path and PyInstaller presence
          Write-Host "Python Path: $(Get-Command python | Select-Object -ExpandProperty Source)"
          python -m PyInstaller --version
          
          # Run build (Runs 'prebuild:backend' -> 'build_backend.py' first)
          npm run build

      # ----------------------------------------------------------------
      # 4. Create Release (Only on Tags)
      # ----------------------------------------------------------------
      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: electron-app/dist/*.exe
          generate_release_notes: true
          make_latest: true
