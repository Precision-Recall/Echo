name: Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-release:
    name: Build ${{ matrix.os }} App
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # 1. Setup Python Environment (Backend)
      # ----------------------------------------------------------------
      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' 

      - name: Install PortAudio (macOS only)
        if: matrix.os == 'macos-latest'
        run: brew install portaudio

      - name: Create Virtual Environment & Install Dependencies
        run: |
          uv venv
          uv pip install -e .
        # Installs dependencies from pyproject.toml (includes pyinstaller)

      # ----------------------------------------------------------------
      # 2. Setup Node.js Environment (Frontend/Electron)
      # ----------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: electron-app/package-lock.json

      - name: Install Node Dependencies
        working-directory: electron-app
        run: npm ci

      # ----------------------------------------------------------------
      # 3. Build Application
      # ----------------------------------------------------------------
      - name: Build Electron App (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: electron-app
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          ..\.venv\Scripts\Activate.ps1
          python -m PyInstaller --version
          npm run build:win

      - name: Build Electron App (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: electron-app
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          source ../.venv/bin/activate
          python -m PyInstaller --version
          npm run build:mac

      # ----------------------------------------------------------------
      # 4. Create Release (Only on Tags)
      # ----------------------------------------------------------------
      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            electron-app/dist/*.exe
            electron-app/dist/*.dmg
          generate_release_notes: true
          make_latest: true
