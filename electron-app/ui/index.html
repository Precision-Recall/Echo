<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
    <title>ECHO Voice Assistant</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app" id="app">
        <!-- Chain of Thought Panel (when expanded) -->
        <!-- Split Container (when expanded) -->
        <div class="split-container" id="cotPanel">
            <!-- Left Panel: Conversation & Thinking -->
            <div class="panel left-panel">
                <div class="panel-header">
                    <span class="panel-title">Thinking & Response</span>
                    <span class="cot-status" id="cotStatus">Idle</span>
                </div>
                <div class="panel-content" id="mainContent">
                    <!-- Conversation logs -->
                </div>
            </div>

            <!-- Right Panel: Tools & Debug Logs -->
            <div class="panel right-panel">
                <div class="panel-header">
                    <span class="panel-title">Tools & Logs</span>
                </div>
                <div class="panel-content" id="logContent">
                    <!-- Technical logs -->
                </div>
            </div>
        </div>

        <!-- Bottom Bar -->
        <div class="bottom-bar">
            <!-- Status Orb -->
            <div class="orb" id="statusOrb">
                <div class="orb-inner"></div>
                <div class="spinner" id="spinner"></div>
            </div>

            <!-- Waveform -->
            <div class="waveform" id="waveform">
                <!-- Wave bars generated by JS -->
            </div>

            <!-- Hotkey Badge -->
            <div class="hotkey">ALT+SPACE</div>

            <!-- Expand/Collapse Button -->
            <button class="expand-btn" id="expandBtn" title="Show chain of thought">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline id="expandIcon" points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>

</html>
